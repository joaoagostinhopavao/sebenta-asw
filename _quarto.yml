project:
  type: book
  output-dir: docs
  resources:
    - assets/images/heroes/
    - assets/images/capa/

lang: pt-PT
bibliography: referencias.bib

# O ficheiro de idioma "pt" embutido no Quarto usa termos do português do
# Brasil (ex: "Seção"). Estas entradas corrigem para português europeu.
language:
  crossref-sec-prefix: "Secção"
  crossref-ch-prefix: "Capítulo"
  crossref-apx-prefix: "Apêndice"
  section-title-appendices: "Apêndices"
  section-title-reuse: "Reutilização"
  section-title-copyright: "Direitos de autor"

book:
  title: "Aplicações e Serviços Web"
  subtitle: "Sebenta da Unidade Curricular"
  author:
    - name: "João Pavão"
      affiliation: "Universidade de Trás-os-Montes e Alto Douro"
  date: "2026-08-26"

  chapters:
    - index.qmd
    - capitulos/cap01.qmd
    - capitulos/cap02.qmd
    - capitulos/cap03.qmd
    - capitulos/cap04.qmd
    - capitulos/cap05.qmd
    - capitulos/cap06.qmd
    - capitulos/cap07.qmd
    - capitulos/cap08.qmd

  appendices:
    - capitulos/apendiceA.qmd
    - capitulos/apendiceB.qmd
    - capitulos/apendiceC.qmd
    - capitulos/apendiceD1.qmd
    - capitulos/apendiceD2.qmd
    - capitulos/apendiceD3.qmd
    - capitulos/apendiceD4.qmd
    - capitulos/apendiceD5.qmd
    - capitulos/apendiceD6.qmd

  sidebar:
    search: true
    tools:
      - icon: translate
        href: /en/
        text: "English version"

  page-footer:
    left: "Aplicações e Serviços Web — UTAD"

format:
  html:
    theme:
        light: litera
        dark: darkly
    css: assets/css/custom.css
    toc: true
    toc-depth: 3
    smooth-scroll: true
    number-sections: true
    number-depth: 3
    highlight-style: github
    code-fold: false
    code-tools: false
    code-line-numbers: true
    fig-align: center

  pdf:
    documentclass: scrbook
    classoption: [oneside]
    papersize: a4
    fontsize: 11pt
    toc: true
    toc-depth: 3
    number-sections: true
    code-line-numbers: true
    colorlinks: true
    linkcolor: "NavyBlue"
    urlcolor: "NavyBlue"
    geometry:
      - top=2.5cm
      - bottom=2.5cm
      - left=3cm
      - right=2.5cm
    include-in-header:
      text: |
        \AtBeginDocument{\input{assets/cover.tex}}
        \usepackage{booktabs}
        \usepackage{longtable}
        \usepackage{array}
        \usepackage{multirow}
        \usepackage{amssymb}
        \usepackage{amsmath}
        \usepackage{caption}
        \captionsetup{font=small, labelfont=bf}
        \usepackage{xcolor}
        \usepackage{tikz}
        \usepackage{framed}
        \definecolor{httpmsgbg}{HTML}{f2f3f4}
        \definecolor{httpmsgborder}{HTML}{c3cacd}
        \makeatletter
        \def\FrameCommand{\fboxsep=8pt\fcolorbox{httpmsgborder}{httpmsgbg}}
        \makeatother
        \newenvironment{httpmsg}{%
          \small\ttfamily
          \begin{framed}
        }{%
          \end{framed}
        }
        \definecolor{coverDark}{HTML}{0a1420}
        \definecolor{coverAccent}{HTML}{0e6e8c}
        \definecolor{coverLight}{HTML}{4dd0e1}
        \definecolor{chapbg}{HTML}{dcf2f5}
        \definecolor{chapnum}{HTML}{0a4a5c}
        \definecolor{chaptxt}{HTML}{0a1a20}
        \KOMAoption{chapterprefix}{false}
        \makeatletter
        \renewcommand{\chapterlinesformat}[3]{%
          {\setlength{\fboxsep}{12pt}%
          \noindent\colorbox{chapbg}{%
            \parbox[c][5cm]{\dimexpr\linewidth-2\fboxsep\relax}{%
              \def\@chnum{#2}%
              \ifx\@chnum\@empty%
                {\raggedright\hyphenpenalty=10000\exhyphenpenalty=10000\color{chaptxt}\huge\bfseries #3}%
              \else%
                \begin{minipage}[c]{3cm}%
                  \centering\color{chapnum}\fontsize{104}{104}\selectfont\bfseries #2%
                \end{minipage}%
                \hspace{10pt}%
                \begin{minipage}[c]{\dimexpr\linewidth-2\fboxsep-3cm-10pt\relax}%
                  \raggedright\hyphenpenalty=10000\exhyphenpenalty=10000\color{chaptxt}\fontsize{20}{24}\selectfont\bfseries #3%
                \end{minipage}%
              \fi%
            }%
          }}%
        }
        \makeatother
    pdf-engine: lualatex

execute:
  echo: true
  warning: false
  message: false
